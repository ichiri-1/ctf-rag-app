services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
      - uv-cache:/home/vscode/.cache/uv
      - claude-cache:/home/vscode/.claude
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: sleep infinity

volumes:
  uv-cache:
  claude-cache: