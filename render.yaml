services:
  - type: web
    name: ctf-rag-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    port: 8000
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # Render ダッシュボードで手動設定
      - key: DATA_DIR
        value: /data
    disk:
      name: chroma-data
      mountPath: /data
      sizeGB: 1
