services:
  - type: web
    name: ctf-rag-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    port: 8000
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATA_DIR
        value: /data
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false